name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,video]' build ruff
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installed wheel and rendering assets
        run: |
          python -m venv /tmp/macpp-wheel
          /tmp/macpp-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/macpp-wheel/bin/python -c "import gymnasium as gym, macpp; e = gym.make('macpp-3x3-2a-1p-2o-v0', render_mode='rgb_array'); e.reset(seed=1); e.step(e.action_space.sample()); assert e.render().shape == (300, 300, 3); e.close()"
